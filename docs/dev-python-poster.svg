<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- HEADER -->
  <text x="40" y="50" font-size="30" font-weight="800" fill="#0f172a">HeartBeat <tspan fill="#3b82f6">·</tspan> pure-Python port</text>
  <text x="40" y="76" font-size="14" fill="#64748b">backend architecture — one <tspan font-weight="700" fill="#2563eb">hb</tspan> console · stdlib-only core · pluggable Stage B · gate cmds stay user shell (the DAG contract)</text>
  <g font-size="12" fill="#2563eb">
    <rect x="1108" y="26" width="128" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="1172" y="42" text-anchor="middle">pip: heartbeat-hb</text>
    <rect x="1244" y="26" width="132" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="1310" y="42" text-anchor="middle">import heartbeat</text>
    <rect x="1384" y="26" width="96"  height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="1432" y="42" text-anchor="middle">console: hb</text>
    <rect x="1488" y="26" width="88"  height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="1532" y="42" text-anchor="middle">py ≥ 3.9</text>
  </g>
  <line x1="40" y1="90" x2="1576" y2="90" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ══════════ P1 — RUNTIME FLOW ══════════ -->
  <rect x="24" y="100" width="512" height="776" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="128" font-size="17" font-weight="700" fill="#0f172a">Runtime flow</text>

  <!-- Stage B band -->
  <rect x="40" y="146" width="480" height="150" rx="10" fill="#eef2ff"/>
  <text x="54" y="166" font-size="11.5" font-weight="700" fill="#4f46e5">STAGE B — non-deterministic (pluggable)</text>
  <rect x="54" y="178" width="210" height="104" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="159" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">executor.py</text>
  <text x="159" y="219" text-anchor="middle" font-size="11" fill="#4338ca">the driver</text>
  <text x="159" y="238" text-anchor="middle" font-size="10.5" fill="#6366f1">serial · worktree-parallel</text>
  <text x="159" y="255" text-anchor="middle" font-size="10.5" fill="#6366f1">escalate-only · attempt cap</text>
  <text x="159" y="271" text-anchor="middle" font-size="10.5" fill="#6366f1">strict-gate mode</text>
  <rect x="300" y="178" width="214" height="104" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="407" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">backends/</text>
  <text x="407" y="219" text-anchor="middle" font-size="11" fill="#4338ca">ollama · agno · crewai</text>
  <text x="407" y="236" text-anchor="middle" font-size="11" fill="#4338ca">claude · script</text>
  <text x="407" y="256" text-anchor="middle" font-size="10.5" fill="#6366f1">in-process or subprocess</text>
  <text x="407" y="271" text-anchor="middle" font-size="10.5" fill="#6366f1">execute · refute</text>
  <line x1="264" y1="222" x2="298" y2="222" stroke="#6366f1" stroke-width="1.8" marker-end="url(#ai)"/>
  <path d="M298,244 L266,244" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ai)"/>

  <!-- Data band -->
  <rect x="40" y="316" width="480" height="140" rx="10" fill="#fff7ed"/>
  <text x="54" y="336" font-size="11.5" font-weight="700" fill="#b45309">INFORMED STATE — the source of truth</text>
  <rect x="54" y="348" width="188" height="92" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
  <text x="148" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">events.jsonl</text>
  <text x="148" y="396" text-anchor="middle" font-size="10.5" fill="#b45309">append-only log</text>
  <text x="148" y="413" text-anchor="middle" font-size="10.5" fill="#b45309">authoritative</text>
  <rect x="262" y="348" width="116" height="92" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
  <text x="320" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">state.json</text>
  <text x="320" y="400" text-anchor="middle" font-size="10.5" fill="#b45309">projection</text>
  <rect x="398" y="348" width="116" height="92" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
  <text x="456" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">dag.json</text>
  <text x="456" y="400" text-anchor="middle" font-size="10" fill="#b45309">phases·tasks</text>
  <text x="456" y="415" text-anchor="middle" font-size="10" fill="#b45309">gates</text>
  <line x1="242" y1="394" x2="260" y2="394" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="251" y="358" text-anchor="middle" font-size="9.5" fill="#334155">project</text>

  <!-- Stage A band -->
  <rect x="40" y="476" width="480" height="212" rx="10" fill="#f0fdfa"/>
  <text x="54" y="496" font-size="11.5" font-weight="700" fill="#0d9488">STAGE A — deterministic (stdlib)</text>
  <rect x="54" y="508" width="252" height="164" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/>
  <text x="180" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">tick.py — priority checks</text>
  <text x="180" y="550" text-anchor="middle" font-size="10.5" fill="#0f766e">lock · integrity · rot · breaker</text>
  <text x="180" y="567" text-anchor="middle" font-size="10.5" fill="#0f766e">drift · gate-errors · next-task</text>
  <text x="180" y="592" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">→ { wakeAgent, reason, action }</text>
  <text x="180" y="612" text-anchor="middle" font-size="10.5" fill="#0f766e">resolver · lint · self-describing</text>
  <text x="180" y="640" text-anchor="middle" font-size="10.5" fill="#0f766e">gate.py runs the shell criteria;</text>
  <text x="180" y="656" text-anchor="middle" font-size="10.5" fill="#0f766e">pass → git commit + tag</text>
  <rect x="318" y="508" width="90" height="164" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/>
  <text x="363" y="530" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">gate.py</text>
  <text x="363" y="552" text-anchor="middle" font-size="10.5" fill="#0f766e">shell</text>
  <text x="363" y="568" text-anchor="middle" font-size="10.5" fill="#0f766e">criteria</text>
  <text x="363" y="592" text-anchor="middle" font-size="10.5" fill="#0f766e">--check</text>
  <text x="363" y="608" text-anchor="middle" font-size="10.5" fill="#0f766e">--all</text>
  <rect x="420" y="508" width="94" height="164" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/>
  <text x="467" y="530" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">hb</text>
  <text x="467" y="552" text-anchor="middle" font-size="10.5" fill="#0f766e">console</text>
  <text x="467" y="574" text-anchor="middle" font-size="10.5" fill="#0f766e">doctor</text>
  <text x="467" y="590" text-anchor="middle" font-size="10.5" fill="#0f766e">diagnose</text>
  <text x="467" y="612" text-anchor="middle" font-size="10.5" fill="#0f766e">report</text>

  <!-- connecting arrows -->
  <path d="M54,560 L34,560 L34,230 L52,230" fill="none" stroke="#6366f1" stroke-width="1.8" marker-end="url(#ai)"/>
  <text x="26" y="395" transform="rotate(-90 26 395)" text-anchor="middle" font-size="10" font-weight="600" fill="#4f46e5">wake · reason · action</text>
  <path d="M159,282 L159,346" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="228" y="322" text-anchor="middle" font-size="9.5" fill="#334155">driver mediates state</text>
  <path d="M300,440 L250,506" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="322" y="472" text-anchor="middle" font-size="9.5" fill="#64748b">reads state · log · dag</text>

  <text x="280" y="712" text-anchor="middle" font-size="10.5" fill="#94a3b8">The tick wakes Stage B only on real work; the driver mediates every state</text>
  <text x="280" y="728" text-anchor="middle" font-size="10.5" fill="#94a3b8">transition; gates verify behaviour; git tags each phase as a restore point.</text>
  <g font-size="10" fill="#64748b">
    <circle cx="60" cy="752" r="5" fill="#6366f1"/><text x="70" y="756">Stage B</text>
    <circle cx="150" cy="752" r="5" fill="#d97706"/><text x="160" y="756">data / truth</text>
    <circle cx="260" cy="752" r="5" fill="#0d9488"/><text x="270" y="756">Stage A</text>
  </g>

  <!-- ══════════ P2 — MODULES ══════════ -->
  <rect x="552" y="100" width="520" height="396" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="572" y="128" font-size="17" font-weight="700" fill="#0f172a">Modules <tspan font-size="12" font-weight="400" fill="#64748b">· heartbeat/</tspan></text>
  <text x="572" y="150" font-size="11" font-weight="700" fill="#94a3b8">module</text>
  <text x="740" y="150" font-size="11" font-weight="700" fill="#94a3b8">key API</text>
  <g font-size="11.5">
    <!-- rows -->
    <g fill="#334155">
      <rect x="560" y="158" width="504" height="22" fill="#f8fafc"/>
      <text x="572" y="173" font-weight="600" fill="#0f172a">state.py</text><text x="740" y="173">project · mutate · reproject · leases</text>
      <text x="572" y="195" font-weight="600" fill="#0f172a">resolver.py</text><text x="740" y="195">resolve · ready_tasks</text>
      <rect x="560" y="202" width="504" height="22" fill="#f8fafc"/>
      <text x="572" y="217" font-weight="600" fill="#0f172a">lint.py</text><text x="740" y="217">lint · extract_paths</text>
      <text x="572" y="239" font-weight="600" fill="#0f172a">audit.py</text><text x="740" y="239">audit · classify · is_nondet</text>
      <rect x="560" y="246" width="504" height="22" fill="#f8fafc"/>
      <text x="572" y="261" font-weight="600" fill="#0f172a">review.py</text><text x="740" y="261">build_prompt · run  (agent refute)</text>
      <text x="572" y="283" font-weight="600" fill="#0f172a">gate.py</text><text x="740" y="283">eval_gate · run_gate · run_all</text>
      <rect x="560" y="290" width="504" height="22" fill="#f8fafc"/>
      <text x="572" y="305" font-weight="600" fill="#0f172a">tick.py</text><text x="740" y="305">tick → { wakeAgent, data }</text>
      <text x="572" y="327" font-weight="600" fill="#0f172a">doctor.py</text><text x="740" y="327">doctor · has_rot · diagnose</text>
      <rect x="560" y="334" width="504" height="22" fill="#f8fafc"/>
      <text x="572" y="349" font-weight="600" fill="#0f172a">report.py · scaffold.py</text><text x="740" y="349">build/render · init  (hb init)</text>
      <text x="572" y="371" font-weight="600" fill="#0f172a">protocol.py</text><text x="740" y="371">PROTOCOL · render_md</text>
      <rect x="560" y="378" width="504" height="22" fill="#eef2ff"/>
      <text x="572" y="393" font-weight="700" fill="#4338ca">executor.py</text><text x="740" y="393" fill="#4338ca">run · config · dispatch</text>
      <rect x="560" y="400" width="504" height="22" fill="#eef2ff"/>
      <text x="572" y="415" font-weight="700" fill="#4338ca">backends/</text><text x="740" y="415" fill="#4338ca">get(name) → execute / refute</text>
      <rect x="560" y="422" width="504" height="22" fill="#eff6ff"/>
      <text x="572" y="437" font-weight="700" fill="#2563eb">cli.py</text><text x="740" y="437" fill="#2563eb">main → the hb console</text>
    </g>
  </g>
  <text x="572" y="470" font-size="10.5" fill="#64748b">Mutation path: with_wlock → append_event → reproject → atomic write.</text>
  <text x="572" y="486" font-size="10.5" fill="#64748b">Core is stdlib-only; framework imports live inside backends/ behind degrade.</text>

  <!-- ══════════ P3 — EXECUTOR LOOP ══════════ -->
  <rect x="552" y="512" width="520" height="364" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="572" y="540" font-size="17" font-weight="700" fill="#0f172a">Executor loop &amp; backends</text>

  <rect x="568" y="552" width="488" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="580" y="571" font-size="11" fill="#334155"><tspan font-weight="700">wire</tspan>  driver → backend:  argv = execute|refute · stdin = payload JSON</text>
  <text x="580" y="589" font-size="11" fill="#334155">  ←  execute <tspan font-weight="700">{ ok, summary }</tspan>    refute <tspan font-weight="700">{ refuted, findings }</tspan></text>

  <text x="572" y="620" font-size="11.5" font-weight="700" fill="#4f46e5">reason → action  (escalate-only)</text>
  <g font-size="11" fill="#334155">
    <text x="576" y="640"><tspan font-weight="700" fill="#0f766e">next_task</tspan>  → start → dispatch execute → done / fail  <tspan fill="#94a3b8">(cap → escalate)</tspan></text>
    <text x="576" y="660"><tspan font-weight="700" fill="#0f766e">gate_pending</tspan>  → [strict? refuse weak gate] → gate.run_gate</text>
    <text x="576" y="680"><tspan font-weight="700" fill="#0f766e">review_pending</tspan>  → dispatch refute → review pass | fail</text>
    <text x="576" y="700"><tspan font-weight="700" fill="#0f766e">all_done</tspan>  → report → stop</text>
    <text x="576" y="720"><tspan font-weight="700" fill="#b45309">gate_blocked · build_stuck · deadlock · …</tspan>  → escalate (STOP)</text>
    <text x="576" y="740"><tspan font-weight="700" fill="#4338ca">parallel</tspan>  concurrency &gt; 1 → ready N · git worktree / task · serialized merge</text>
  </g>

  <line x1="568" y1="756" x2="1056" y2="756" stroke="#e2e8f0"/>
  <text x="572" y="778" font-size="11.5" font-weight="700" fill="#4338ca">backends  <tspan font-size="10.5" font-weight="400" fill="#64748b">(HB_EXEC_PROVIDER = anthropic | ollama · HB_EXEC_MODEL)</tspan></text>
  <g font-size="11">
    <rect x="572" y="790" width="118" height="34" rx="7" fill="#eef2ff" stroke="#c7d2fe"/><text x="631" y="805" text-anchor="middle" font-weight="700" fill="#4338ca">ollama</text><text x="631" y="819" text-anchor="middle" font-size="9.5" fill="#6366f1">local · stdlib</text>
    <rect x="700" y="790" width="110" height="34" rx="7" fill="#eef2ff" stroke="#c7d2fe"/><text x="755" y="805" text-anchor="middle" font-weight="700" fill="#4338ca">agno</text><text x="755" y="819" text-anchor="middle" font-size="9.5" fill="#6366f1">FileTools</text>
    <rect x="820" y="790" width="110" height="34" rx="7" fill="#eef2ff" stroke="#c7d2fe"/><text x="875" y="805" text-anchor="middle" font-weight="700" fill="#4338ca">crewai</text><text x="875" y="819" text-anchor="middle" font-size="9.5" fill="#6366f1">FILE-block</text>
    <rect x="940" y="790" width="56" height="34" rx="7" fill="#eef2ff" stroke="#c7d2fe"/><text x="968" y="805" text-anchor="middle" font-weight="700" fill="#4338ca">claude</text><text x="968" y="819" text-anchor="middle" font-size="9.5" fill="#6366f1">-p</text>
    <rect x="1006" y="790" width="50" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1031" y="805" text-anchor="middle" font-weight="700" fill="#334155">script</text><text x="1031" y="819" text-anchor="middle" font-size="9.5" fill="#64748b">cmd</text>
  </g>
  <text x="572" y="850" font-size="10.5" fill="#64748b">Backends never touch state.json or gate.sh — only the driver mediates state.</text>
  <text x="572" y="866" font-size="10.5" fill="#64748b">Missing lib/server → protocol-valid degrade { ok:false } / { refuted:false }.</text>

  <!-- ══════════ P4 — CLI ══════════ -->
  <rect x="1088" y="100" width="488" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1108" y="128" font-size="17" font-weight="700" fill="#0f172a">hb <tspan font-size="12" font-weight="400" fill="#64748b">&lt;cmd&gt;  · --dir &gt; $HB_DIR &gt; ./.hb</tspan></text>
  <g font-size="11.5">
    <text x="1108" y="158" font-weight="700" fill="#0f766e">scaffold / state</text>
    <text x="1108" y="176" fill="#334155">init · tick · next · ready · state · rebuild</text>
    <text x="1108" y="204" font-weight="700" fill="#0f766e">work</text>
    <text x="1108" y="222" fill="#334155">start · done · fail · heartbeat · review</text>
    <text x="1108" y="250" font-weight="700" fill="#0f766e">verify</text>
    <text x="1108" y="268" fill="#334155">gate · lint · audit [--agent] · doctor · diagnose</text>
    <text x="1108" y="296" font-weight="700" fill="#0f766e">drive</text>
    <text x="1108" y="314" fill="#334155">exec [run] [--parallel N]</text>
    <text x="1108" y="342" font-weight="700" fill="#0f766e">info</text>
    <text x="1108" y="360" fill="#334155">report [--json] · protocol [--md]</text>
  </g>
  <text x="1108" y="386" font-size="10.5" fill="#64748b">State mutates only through the CLI — never hand-edit state.json.</text>

  <!-- ══════════ P5 — DATA MODEL ══════════ -->
  <rect x="1088" y="416" width="488" height="250" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1108" y="444" font-size="17" font-weight="700" fill="#0f172a">Data model</text>
  <g font-size="11">
    <text x="1108" y="470" fill="#334155"><tspan font-weight="700" fill="#b45309">dag</tspan>  phases → tasks (requires) → gates</text>
    <text x="1108" y="490" fill="#334155"><tspan font-weight="700" fill="#b45309">gate</tspan>  criteria[].cmd = shell, exit 0 = pass · review? { prompt }</text>
    <text x="1108" y="516" font-weight="700" fill="#b45309">events  (state-mutating)</text>
    <text x="1108" y="534" fill="#334155">initialized · task_started / done / failed</text>
    <text x="1108" y="551" fill="#334155">lease_expired · gate_passed / failed · review_passed / failed</text>
    <text x="1108" y="577" font-weight="700" fill="#4338ca">projection rule</text>
    <text x="1108" y="595" fill="#334155">phase closes ⇔ gate det AND (no review OR rev)</text>
    <text x="1108" y="621" font-weight="700" fill="#0f766e">state</text>
    <text x="1108" y="639" fill="#334155">current_phase · active / completed_tasks · completed_phases</text>
    <text x="1108" y="656" fill="#334155">pending_reviews · build_stuck_count (5 → breaker) · gate.errors</text>
  </g>

  <!-- ══════════ P6 — PARITY & INVARIANTS ══════════ -->
  <rect x="1088" y="682" width="488" height="194" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1108" y="710" font-size="17" font-weight="700" fill="#0f172a">Parity contract &amp; invariants</text>
  <g font-size="11">
    <text x="1108" y="736" fill="#334155"><tspan font-weight="700" fill="#2563eb">parity</tspan> (tests/parity.sh) — node ≡ python on</text>
    <text x="1108" y="753" fill="#334155">project · resolve · lint · audit · diagnose · state</text>
    <text x="1108" y="770" fill="#334155">PROTOCOL <tspan font-weight="700">reason keys</tspan> match; action text is runtime-specific</text>
    <line x1="1108" y1="784" x2="1556" y2="784" stroke="#e2e8f0"/>
    <text x="1108" y="804" fill="#334155">• events = truth · never hand-edit state.json</text>
    <text x="1108" y="822" fill="#334155">• backends never touch state / gate · driver mediates</text>
    <text x="1108" y="840" fill="#334155">• gates behavioral &amp; deterministic · audit-clean before run</text>
    <text x="1108" y="858" fill="#334155">• core stdlib-only · suites + parity green before commit</text>
  </g>

  <text x="1568" y="892" text-anchor="end" font-size="10" fill="#cbd5e1">source: docs/dev-python.md</text>
</svg>
