[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbeat-hb"
version = "0.19.6"
description = "HeartBeat — tick-driven agent orchestration (pure-Python port, zero node/bash)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # core is stdlib-only

[project.optional-dependencies]
test = ["pytest"]                 # the Python test suite (pytest -q); install with .[test]
agno = ["agno", "openai", "ollama"]
crewai = ["crewai"]
langgraph = ["langgraph", "langchain-ollama"]
openai-agents = ["openai-agents"]
autogen = ["autogen-agentchat", "autogen-ext[openai]"]
smolagents = ["smolagents", "openai"]
pydantic-ai = ["pydantic-ai"]
mcp-test = ["mcp>=2"]              # official MCP SDK v2 — for the on-demand real-client interop proof only

[project.scripts]
hb = "heartbeat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
